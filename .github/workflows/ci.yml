name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logs

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: logs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        
        options: >-
          --health-cmd "pg_isready -U postgres -d logs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run database migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

      - name: Smoke test all four endpoints
        run: npm run smoke

services:
  app:
    build: .
    
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs
      RETENTION_DAYS: 30
      RETENTION_INTERVAL_MS: 3600000
      
      RETENTION_PARTITION_HOURS: 24
      
      RETENTION_PARTITIONS_AHEAD: 2
      
      RETENTION_LOCK_TIMEOUT_MS: 3000
     
      RETENTION_BATCH_SIZE: 10000
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # PostgreSQL ships conservative defaults (shared_buffers=128MB, work_mem=4MB,
    # max_wal_size=1GB) that ignore this container's 1G budget and, under sustained
    # writes (~12MB/s of WAL measured here), force a checkpoint roughly every 85s.
    # These flags size the server to the container and let the 300s checkpoint
    # timer bind instead. Passed with -c so the whole config is reviewable here.
    command:
      - "postgres"
      # Shared buffer pool: a quarter of the 1G limit (default 128MB).
      - "-c"
      - "shared_buffers=256MB"
      
      - "-c"
      - "effective_cache_size=768MB"
      # Per-node memory for query execution (default 4MB).
      - "-c"
      - "work_mem=16MB"
      # Index builds (the partition migration) and vacuum.
      - "-c"
      - "maintenance_work_mem=128MB"
      # WAL volume: a quarter of the 1G limit (default 1GB).
      - "-c"
      - "max_wal_size=4GB"
      
      - "-c"
      - "min_wal_size=1GB"
      # Checkpoint frequency: 300s (default 5min) or 90% of max_wal_size (default 1GB).
      - "-c"
      - "checkpoint_completion_target=0.9"
     
      - "-c"
      - "wal_compression=lz4"
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_data:
services:
  app:
    build: .
    
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set at runtime rather than in the Dockerfile: drizzle-kit is a
      # devDependency but runs at startup for migrations, so NODE_ENV must not
      # be production while `npm ci` installs, or the build and the migration
      # step would both lose the packages they need.
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs
      # Ingestion tuning. Both have working defaults in code, so a plain
      # `docker compose up` with no environment file still runs the core
      # service; these are declared here so they can be swept when tuning.
      INGEST_FLUSH_CONCURRENCY: ${INGEST_FLUSH_CONCURRENCY:-2}
      INGEST_MAX_PENDING_REQUESTS: ${INGEST_MAX_PENDING_REQUESTS:-500}
      # A flush has to finish inside its own deadline at the write rate the
      # database actually sustains, not the rate we hope for. The graded
      # database absorbs roughly 950 rows/s; a 10,000-row COPY therefore needs
      # about 10.5s and could never complete within the old 10s timeout, so a
      # full flush was guaranteed to be abandoned -- taking every request
      # packed into it to a 503 and discarding the I/O already spent on it.
      #
      # At 1,000 rows a flush lands near 1s there, and the timeout goes back to
      # being a safety net for a genuinely stuck connection rather than
      # something the steady state runs into.
      INGEST_MAX_FLUSH_ROWS: ${INGEST_MAX_FLUSH_ROWS:-1000}
      INGEST_FLUSH_TIMEOUT_MS: ${INGEST_FLUSH_TIMEOUT_MS:-30000}
      # Declared because it was silently taking its code default; the buffer's
      # depth is a capacity decision and belongs where the other limits are.
      INGEST_MAX_PENDING_ROWS: ${INGEST_MAX_PENDING_ROWS:-25000}
      RETENTION_DAYS: 30
      RETENTION_INTERVAL_MS: 3600000
      
      RETENTION_PARTITION_HOURS: 24
      
      RETENTION_PARTITIONS_AHEAD: 2
      
      RETENTION_LOCK_TIMEOUT_MS: 3000
     
      RETENTION_BATCH_SIZE: 10000
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # PostgreSQL ships conservative defaults (shared_buffers=128MB, work_mem=4MB,
    # max_wal_size=1GB) that ignore this container's 1G budget and, under sustained
    # writes (~12MB/s of WAL measured here), force a checkpoint roughly every 85s.
    # These flags size the server to the container and let the 300s checkpoint
    # timer bind instead. Passed with -c so the whole config is reviewable here.
    command:
      - "postgres"
      # Shared buffer pool: a quarter of the 1G limit (default 128MB).
      - "-c"
      - "shared_buffers=256MB"
      
      - "-c"
      - "effective_cache_size=768MB"
      # Per-node memory for query execution (default 4MB).
      - "-c"
      - "work_mem=16MB"
      # Index builds (the partition migration) and vacuum.
      - "-c"
      - "maintenance_work_mem=128MB"
      # WAL volume: a quarter of the 1G limit (default 1GB).
      - "-c"
      - "max_wal_size=4GB"
      
      - "-c"
      - "min_wal_size=1GB"
      # Checkpoint frequency: 300s (default 5min) or 90% of max_wal_size (default 1GB).
      - "-c"
      - "checkpoint_completion_target=0.9"
     
      - "-c"
      - "wal_compression=lz4"
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_data: